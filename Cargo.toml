[package]
name = "cdk-ldk-node"
version = "0.1.0"
edition = "2021"

[lib]
name = "cdk_ldk_node"
path = "src/lib.rs"

[[bin]]
name = "cdk-ldk-node"
path = "src/bin/cdk-ldk-node.rs"


[[bin]]
name = "cdk-ldk-web"
path = "src/bin/cdk-ldk-web.rs"

[dependencies]
ldk-node = { version = "0.5.0" }
cdk-payment-processor = { git = "https://github.com/thesimplekid/cdk", branch = "update_bolt12", default-features = false }
cdk-common = { git = "https://github.com/thesimplekid/cdk", branch = "update_bolt12", features = ["mint"] }
serde_json = "1.0.139"
serde = { version = "1.0.218", features = ["derive"] }
async-trait = "0.1.86"
futures = "0.3.31"
anyhow = "1.0.96"
tokio = "1.43.0"
clap = { version = "4.5.31", features = ["derive"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tokio-util = "0.7.13"
tokio-stream = { version = "0.1.17", features = ["sync"] }
home = "0.5.5"

config = { version = "0.15.0", features = ["toml"] }
bip39 = { version = "2.1.0", features = ["rand"] }
maud = "0.27.0"
features = "0.10.0"
axum = { version = "0.8.4", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.6", features = ["fs", "cors"] }
serde_urlencoded = "0.7"



